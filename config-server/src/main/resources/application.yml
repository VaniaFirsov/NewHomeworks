server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/VaniaFirsov/config-repo
          default-label: main
          search-paths: '{application}'
        native:
          search-locations: classpath:/config/{application}
  profiles:
    active: native